name: Manual Archive & Upload IPA

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Pod install
        run: |
          rm -rf Pods Podfile.lock
          pod install

      - name: Setup signing & patch pbxproj
        run: |
          # GitHub Actions runner 没有 Apple 开发者账号登录态 → Manual。
          # 用 Python 直接改 pbxproj：每个 target/configuration 单独写 PROVISIONING_PROFILE_SPECIFIER。
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          # 主 App profile
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/main.mobileprovision
          MAIN_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i /tmp/main.mobileprovision 2>/dev/null)")
          MAIN_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i /tmp/main.mobileprovision 2>/dev/null)")
          cp /tmp/main.mobileprovision "$PP_DIR/${MAIN_UUID}.mobileprovision"
          echo "✅ Main: UUID=${MAIN_UUID} Name=${MAIN_NAME}"

          # Noti 扩展 profile
          echo "$PROVISIONING_PROFILE_EXT_BASE64" | base64 --decode > /tmp/ext.mobileprovision
          EXT_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i /tmp/ext.mobileprovision 2>/dev/null)")
          EXT_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i /tmp/ext.mobileprovision 2>/dev/null)")
          cp /tmp/ext.mobileprovision "$PP_DIR/${EXT_UUID}.mobileprovision"
          echo "✅ Ext:  UUID=${EXT_UUID} Name=${EXT_NAME}"

          # —— Python 改 pbxproj（heredoc 单引号 + 环境变量传参）——
          PBXPROJ="BlueEquipProject.xcodeproj/project.pbxproj"
          MAIN_UUID_VAL="${MAIN_UUID}" EXT_UUID_VAL="${EXT_UUID}" PBXPROJ_VAL="$PBXPROJ" python3 << 'PYEOF'
          import re, os
          p = os.environ["PBXPROJ_VAL"]
          main_uuid = os.environ["MAIN_UUID_VAL"]
          ext_uuid = os.environ["EXT_UUID_VAL"]
          with open(p, "r") as f:
              s = f.read()
          s = s.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          s = s.replace('CODE_SIGN_IDENTITY = "Apple Development";', 'CODE_SIGN_IDENTITY = "Apple Distribution";')
          s = re.sub(r'^\s*PROVISIONING_PROFILE_SPECIFIER[^;]*;\n', '', s, flags=re.MULTILINE)
          s = re.sub(r'^\s*"PROVISIONING_PROFILE_SPECIFIER\[sdk=iphoneos\*\]"[^;]*;\n', '', s, flags=re.MULTILINE)
          s = re.sub(r'^\s*"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]"[^;]*;\n', '', s, flags=re.MULTILINE)
          s = re.sub(r'^\s*"DEVELOPMENT_TEAM\[sdk=iphoneos\*\]"[^;]*;\n', '', s, flags=re.MULTILINE)
          def _insert(m):
              indent = m.group(1)
              bid = m.group(2)
              uuid = main_uuid if bid == "com.lockink.qingQuPro" else ext_uuid
              return m.group(0) + f'\n{indent}PROVISIONING_PROFILE_SPECIFIER = {uuid};'
          s = re.sub(r'^(\s*)PRODUCT_BUNDLE_IDENTIFIER = (com\.lockink\.qingQuPro(?:\.BlueEquipProjectNotiServier)?);', _insert, s, flags=re.MULTILINE)
          with open(p, "w") as f:
              f.write(s)
          print(f"✅ pbxproj 已改：主 App → {main_uuid}，扩展 → {ext_uuid}")
          PYEOF
          echo ""
          echo "=== 签名配置 ==="
          grep -n "PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY" "$PBXPROJ" | head -20
          ls -la "$PP_DIR"
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_EXT_BASE64: ${{ secrets.PROVISIONING_PROFILE_EXT_BASE64 }}

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace BlueEquipProject.xcworkspace \
            -scheme BlueEquipProject \
            -configuration Release \
            -archivePath build/BlueEquipProject.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=L992GPQMS4 \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        run: |
          MAIN_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i /tmp/main.mobileprovision 2>/dev/null)")
          EXT_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i /tmp/ext.mobileprovision 2>/dev/null)")
          mkdir -p build/export
          cat > build/export/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>L992GPQMS4</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.lockink.qingQuPro</key>
                  <string>${MAIN_NAME}</string>
                  <key>com.lockink.qingQuPro.BlueEquipProjectNotiServier</key>
                  <string>${EXT_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/BlueEquipProject.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: BlueEquipProject.ipa
          path: build/export/*.ipa
          if-no-files-found: error
