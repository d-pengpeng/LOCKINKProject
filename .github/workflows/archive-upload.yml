name: Archive & Export IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Pod Install
        run: |
          pod repo update
          pod install --verbose 2>&1 | tail -30
          echo "=== Pod install done ==="
          ls -la Pods/QCloudCore/QCloudCore/Classes/Base/ 2>/dev/null || echo "QCloudCore base dir not found"

      - name: Patch QCloudCore for Xcode 26
        run: |
          # Patch all QCloudCore .m files with missing imports
          find Pods/QCloudCore -name "*.m" -exec sed -i '' '1s/^/#import <CFNetwork\/CFHost.h>\n/' {} \; 2>/dev/null || true
          find Pods/QCloudCore -name "*.m" -exec sed -i '' '1s/^/#import <CoreServices\/AssertMacros.h>\n/' {} \; 2>/dev/null || true
          echo "Patched all QCloudCore .m files"

      - name: Setup signing
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_DIR/53f48a3c-823f-4e48-8911-ddb17f485846.mobileprovision"
          echo "$PROVISIONING_PROFILE_EXT_BASE64" | base64 --decode > "$PP_DIR/f46ef368-3b06-463b-8e9f-8d3acdfa3ace.mobileprovision"
          ls -la "$PP_DIR"
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_EXT_BASE64: ${{ secrets.PROVISIONING_PROFILE_EXT_BASE64 }}

      - name: Create xcconfig
        run: |
          cat > build_settings.xcconfig << 'EOF'
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = L992GPQMS4
          PROVISIONING_PROFILE = d7c4f98a-fb72-4d66-8125-18a1b5a4a538
          PROVISIONING_PROFILE_SPECIFIER = 
          CODE_SIGN_IDENTITY = iPhone Distribution
          EOF
          echo "=== xcconfig ==="
          cat build_settings.xcconfig

      - name: Archive
        run: |
          xcodebuild archive -workspace BlueEquipProject.xcworkspace -scheme BlueEquipProject -configuration Release -archivePath build/BlueEquipProject.xcarchive -destination "generic/platform=iOS"

      - name: Export IPA
        run: |
          mkdir -p build/export
          cat > build/export/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>L992GPQMS4</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.lockink.qingQuPro</key>
                  <dict>
                      <key>signingStyle</key>
                      <string>manual</string>
                      <key>profileUUID</key>
                      <string>53f48a3c-823f-4e48-8911-ddb17f485846</string>
                  </dict>
                  <key>com.lockink.qingQuPro.BlueEquipProjectNotiServier</key>
                  <dict>
                      <key>signingStyle</key>
                      <string>manual</string>
                      <key>profileUUID</key>
                      <string>f46ef368-3b06-463b-8e9f-8d3acdfa3ace</string>
                  </dict>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/BlueEquipProject.xcarchive -exportPath build/export -exportOptionsPlist build/export/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueEquipProject-IPA
          path: build/export/*.ipa

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f certificate.p12
