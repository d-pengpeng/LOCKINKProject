name: Archive & Export IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Pod Install
        run: |
          pod repo update
          pod install --verbose 2>&1 | tail -30
          echo "=== Pod install done ==="
          ls -la Pods/QCloudCore/QCloudCore/Classes/Base/ 2>/dev/null || echo "QCloudCore base dir not found"

      - name: Patch QCloudCore for Xcode 26
        run: |
          # Patch all QCloudCore .m files with missing imports
          find Pods/QCloudCore -name "*.m" -exec sed -i '' '1s/^/#import <CFNetwork\/CFHost.h>\n/' {} \; 2>/dev/null || true
          find Pods/QCloudCore -name "*.m" -exec sed -i '' '1s/^/#import <CoreServices\/AssertMacros.h>\n/' {} \; 2>/dev/null || true
          echo "Patched all QCloudCore .m files"

      - name: Setup signing
        run: |
          # GitHub Actions runner 没有 Apple 开发者账号登录态 → 用 Manual。
          # 但读 profile 自身的 Name / UUID，写 signing.env 给后续 step 用。
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          # 主 App profile
          MAIN_PROFILE="$PP_DIR/temp_main.mobileprovision"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$MAIN_PROFILE"
          MAIN_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$MAIN_PROFILE" 2>/dev/null)")
          MAIN_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$MAIN_PROFILE" 2>/dev/null)")
          mv "$MAIN_PROFILE" "$PP_DIR/${MAIN_UUID}.mobileprovision"
          echo "✅ Main: UUID=${MAIN_UUID} Name=${MAIN_NAME}"
          # Noti 扩展 profile
          EXT_PROFILE="$PP_DIR/temp_ext.mobileprovision"
          echo "$PROVISIONING_PROFILE_EXT_BASE64" | base64 --decode > "$EXT_PROFILE"
          EXT_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$EXT_PROFILE" 2>/dev/null)")
          EXT_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$EXT_PROFILE" 2>/dev/null)")
          mv "$EXT_PROFILE" "$PP_DIR/${EXT_UUID}.mobileprovision"
          echo "✅ Ext:  UUID=${EXT_UUID} Name=${EXT_NAME}"
          # 写 env 文件给后续 step
          echo "MAIN_UUID=${MAIN_UUID}" > signing.env
          echo "MAIN_NAME=${MAIN_NAME}" >> signing.env
          echo "EXT_UUID=${EXT_UUID}" >> signing.env
          echo "EXT_NAME=${EXT_NAME}" >> signing.env
          ls -la "$PP_DIR"
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_EXT_BASE64: ${{ secrets.PROVISIONING_PROFILE_EXT_BASE64 }}

      - name: Archive
        run: |
          source signing.env
          xcodebuild archive \
            -workspace BlueEquipProject.xcworkspace \
            -scheme BlueEquipProject \
            -configuration Release \
            -archivePath build/BlueEquipProject.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=L992GPQMS4 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${MAIN_UUID}" \
            "PROVISIONING_PROFILE_SPECIFIER[BlueEquipProjectNotiServier]=${EXT_UUID}"

      - name: Export IPA
        run: |
          source signing.env
          mkdir -p build/export
          cat > build/export/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>L992GPQMS4</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.lockink.qingQuPro</key>
                  <string>${MAIN_NAME}</string>
                  <key>com.lockink.qingQuPro.BlueEquipProjectNotiServier</key>
                  <string>${EXT_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/BlueEquipProject.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueEquipProject-IPA
          path: build/export/*.ipa

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f certificate.p12
