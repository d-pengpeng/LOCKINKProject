workflows:
  ios-workflow:
    name: BlueEquipProject Archive & Export
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        DEVELOPMENT_TEAM: L992GPQMS4
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    scripts:
      - name: Pod install
        script: |
          pod repo update
          pod install
          echo "=== Pod install done ==="

      - name: Patch QCloudCore for Xcode 26
        script: |
          find Pods/QCloudCore -name "*.m" -exec sed -i '' '1s/^/#import <CFNetwork\/CFHost.h>\n/' {} \; 2>/dev/null || true
          find Pods/QCloudCore -name "*.m" -exec sed -i '' '1s/^/#import <CoreServices\/AssertMacros.h>\n/' {} \; 2>/dev/null || true
          echo "Patched all QCloudCore .m files"

      - name: Fix pbxproj signing (remove SDK-specific SPECIFIER overrides)
        script: |
          PBXPROJ="BlueEquipProject.xcodeproj/project.pbxproj"
          # Remove SDK-specific PROVISIONING_PROFILE_SPECIFIER lines that override UUID-based lookup
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER\[sdk=iphoneos/d' "$PBXPROJ"
          echo "Removed SDK-specific PROVISIONING_PROFILE_SPECIFIER overrides"

      - name: Setup code signing
        script: |
          echo "=== ENV vars with CM_ prefix ==="
          env | grep CM_ | sort || echo "No CM_ vars"

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "=== Provisioning Profiles dir before ==="
          ls -la "$PP_DIR" 2>/dev/null || echo "Empty"

          # Codemagic UI 上传的 profile 会通过 CM_PROVISIONING_PROFILE 环境变量提供
          # 也可以在 /tmp/codemagic-certs/ 或其他路径
          echo "=== Searching for profiles in common locations ==="
          find /tmp -name "*.mobileprovision" 2>/dev/null || true
          find $HOME -name "*.mobileprovision" 2>/dev/null | head -10 || true

          # 从 Codemagic 环境变量获取 profile 并安装
          for var in CM_PROVISIONING_PROFILE CM_PROVISIONING_PROFILE_1; do
            eval "PP_PATH=\$$var"
            if [ -n "$PP_PATH" ] && [ -f "$PP_PATH" ]; then
              UUID=$(security cms -d -i "$PP_PATH" 2>/dev/null | plutil -extract UUID raw -o - - 2>/dev/null)
              if [ -n "$UUID" ]; then
                cp "$PP_PATH" "$PP_DIR/${UUID}.mobileprovision"
                echo "Installed profile $var -> UUID: $UUID"
              fi
            fi
          done

          echo "=== Provisioning Profiles dir after ==="
          ls -la "$PP_DIR" 2>/dev/null || echo "Empty"

          # 查找已安装 profile 的实际 UUID 和 Bundle ID，更新 pbxproj
          PBXPROJ="BlueEquipProject.xcodeproj/project.pbxproj"
          MAIN_UUID=""
          EXT_UUID=""

          for f in "$PP_DIR"/*.mobileprovision; do
            [ -f "$f" ] || continue
            UUID=$(basename "$f" .mobileprovision)
            BUNDLE_ID=$(security cms -d -i "$f" 2>/dev/null | plutil -extract com.application-identifier raw -o - - 2>/dev/null | sed 's/.*\.\([^.]*\)$/\1/')
            echo "Profile: $UUID -> BundleID: $BUNDLE_ID"

            if [ "$BUNDLE_ID" = "com.lockink.qingQuPro" ]; then
              MAIN_UUID="$UUID"
            elif [ "$BUNDLE_ID" = "com.lockink.qingQuPro.BlueEquipProjectNotiServier" ]; then
              EXT_UUID="$UUID"
            fi
          done

          echo "Main App Profile UUID: $MAIN_UUID"
          echo "Extension Profile UUID: $EXT_UUID"

          # 更新 pbxproj 中的 PROVISIONING_PROFILE UUID（匹配任意 UUID 格式）
          if [ -n "$MAIN_UUID" ]; then
            sed -i '' "s/PROVISIONING_PROFILE = \"[0-9a-f-]*\"/PROVISIONING_PROFILE = \"$MAIN_UUID\"/g" "$PBXPROJ" 2>/dev/null || true
            echo "Updated pbxproj main app profile UUID"
          fi
          if [ -n "$EXT_UUID" ]; then
            # 扩展的 UUID 在 pbxproj 中是第二个出现的
            awk -v uuid="$EXT_UUID" 'NR==FNR{count+=gsub(/PROVISIONING_PROFILE/,"&")} {if(/PROVISIONING_PROFILE/ && ++seen==count) gsub(/"[0-9a-f-]*"/,"\""uuid"\"")} 1' "$PBXPROJ" > /tmp/pbxproj.tmp && mv /tmp/pbxproj.tmp "$PBXPROJ"
            echo "Updated pbxproj extension profile UUID"
          fi

      - name: Archive
        script: |
          xcodebuild archive \
            -workspace BlueEquipProject.xcworkspace \
            -scheme BlueEquipProject \
            -configuration Release \
            -archivePath build/BlueEquipProject.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=L992GPQMS4 \
            CODE_SIGN_IDENTITY="iPhone Distribution"

      - name: Export IPA
        script: |
          mkdir -p build/export
          # 从 pbxproj 中读取更新后的 UUID
          MAIN_UUID=$(grep -m1 'PROVISIONING_PROFILE = ' BlueEquipProject.xcodeproj/project.pbxproj | head -1 | sed 's/.*= "//;s/".*//')
          EXT_UUID=$(grep 'PROVISIONING_PROFILE = ' BlueEquipProject.xcodeproj/project.pbxproj | tail -1 | sed 's/.*= "//;s/".*//')
          echo "Export UUIDs - Main: $MAIN_UUID, Ext: $EXT_UUID"

          cat > build/export/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>L992GPQMS4</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.lockink.qingQuPro</key>
                  <dict>
                      <key>signingStyle</key>
                      <string>manual</string>
                      <key>profileUUID</key>
                      <string>${MAIN_UUID}</string>
                  </dict>
                  <key>com.lockink.qingQuPro.BlueEquipProjectNotiServier</key>
                  <dict>
                      <key>signingStyle</key>
                      <string>manual</string>
                      <key>profileUUID</key>
                      <string>${EXT_UUID}</string>
                  </dict>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/BlueEquipProject.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export/ExportOptions.plist

    artifacts:
      - build/export/*.ipa
      - build/BlueEquipProject.xcarchive/dsyms/*.dSYM.zip

    publishing:
      email:
        recipients:
          - dzp998@163.com
        notify:
          success: true
          failure: true
