workflows:
  ios-workflow:
    name: BlueEquipProject Archive & Export
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        DEVELOPMENT_TEAM: L992GPQMS4
      groups:
        - signing
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    scripts:
      - name: Pod install
        script: |
          rm -rf Pods Podfile.lock
          pod repo update
          pod install
          echo "=== Pod install done ==="
          grep "sys/socket.h" Pods/QCloudCore/QCloudCore/Classes/Base/QCLOUDRestNet/DNSCache/QCloudSimplePing.h || echo "⚠️ QCloudSimplePing.h not patched"
          grep "netinet/in.h" Pods/AFNetworking/AFNetworking/AFNetworkReachabilityManager.m || echo "⚠️ AFNetworking not patched"

      - name: Setup code signing
        script: |
          # Codemagic CI 没有 Apple 开发者账号登录态，Automatic signing 会报 "No Accounts"。
          # 改用 Manual，但不在 pbxproj 里硬写 profile 名（Xcode 每次打开都重写）。
          # 做法：解码 base64 → 从 profile 自身读 UUID → 存 MobileDevice/Profiles/<UUID>.mobileprovision
          #       后续 Archive / Export 命令从同一个 UUID 变量注入。
          # 换 profile 只需要换环境变量值，代码零改动。
          #
          # 需要 Codemagic Settings → Environment variables → signing 分组：
          #   BUILD_CERTIFICATE_BASE64          Apple Distribution .p12 (Base64)
          #   BUILD_CERTIFICATE_PASSWORD        .p12 导入密码
          #   PROVISIONING_PROFILE_BASE64       主 App App Store profile (Base64)
          #   PROVISIONING_PROFILE_EXT_BASE64   Noti 扩展 App Store profile (Base64)
          #   KEYCHAIN_PASSWORD                 Codemagic 临时钥匙串密码（任意字符串）

          KEYCHAIN_PATH="$HOME/codemagic.keychain"
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          # —— 1. 创建临时 keychain ——
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # —— 2. 导入 Apple Distribution .p12 ——
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12
            security import /tmp/certificate.p12 \
              -k "$KEYCHAIN_PATH" \
              -P "$BUILD_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign 2>&1
            RC=$?
            if [ $RC -ne 0 ]; then
              echo "❌ .p12 导入失败！退出码: $RC"
              exit 1
            fi
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" \
              "$KEYCHAIN_PATH"
            echo "✅ Apple Distribution 证书已导入"
          else
            echo "❌ BUILD_CERTIFICATE_BASE64 未设置"
            exit 1
          fi

          # —— 3. 安装 provisioning profiles（UUID 作为文件名 + 读 UUID 到 shell 变量）——
          mkdir -p "$PP_DIR"

          if [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/main.mobileprovision
            MAIN_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
              "$(security cms -D -i /tmp/main.mobileprovision 2>/dev/null)")
            cp /tmp/main.mobileprovision "$PP_DIR/${MAIN_UUID}.mobileprovision"
            # 同时读 Name 供 ExportOptions.plist provisioningProfiles 用
            MAIN_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< \
              "$(security cms -D -i /tmp/main.mobileprovision 2>/dev/null)")
            echo "✅ 主 App profile: UUID=${MAIN_UUID} Name=${MAIN_NAME}"
            echo "MAIN_UUID=${MAIN_UUID}" > signing.env
            echo "MAIN_NAME=${MAIN_NAME}" >> signing.env
          else
            echo "❌ PROVISIONING_PROFILE_BASE64 未设置"
            exit 1
          fi

          if [ -n "$PROVISIONING_PROFILE_EXT_BASE64" ]; then
            echo "$PROVISIONING_PROFILE_EXT_BASE64" | base64 --decode > /tmp/ext.mobileprovision
            EXT_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
              "$(security cms -D -i /tmp/ext.mobileprovision 2>/dev/null)")
            cp /tmp/ext.mobileprovision "$PP_DIR/${EXT_UUID}.mobileprovision"
            EXT_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< \
              "$(security cms -D -i /tmp/ext.mobileprovision 2>/dev/null)")
            echo "✅ Noti 扩展 profile: UUID=${EXT_UUID} Name=${EXT_NAME}"
            echo "EXT_UUID=${EXT_UUID}" >> signing.env
            echo "EXT_NAME=${EXT_NAME}" >> signing.env
          else
            echo "❌ PROVISIONING_PROFILE_EXT_BASE64 未设置"
            exit 1
          fi

          echo ""
          echo "=== 钥匙串 identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>&1
          echo "=== Provisioning Profiles 目录 ==="
          ls -la "$PP_DIR"

      - name: Archive
        script: |
          # Codemagic CI 没有 Apple 开发者账号登录态 → Automatic 不行 → Manual。
          # 但 profile 选择用 Setup 脚本从 base64 解码后动态读到的 UUID。
          # 这样换 profile 只换 base64，代码零改动。
          source signing.env
          echo "=== Using profiles ==="
          echo "Main UUID: ${MAIN_UUID} Name: ${MAIN_NAME}"
          echo "Ext  UUID: ${EXT_UUID} Name: ${EXT_NAME}"

          mkdir -p build
          rm -rf ~/Library/Developer/Xcode/DerivedData/BlueEquipProject-*
          set -o pipefail
          xcodebuild archive \
            -workspace BlueEquipProject.xcworkspace \
            -scheme BlueEquipProject \
            -configuration Release \
            -archivePath build/BlueEquipProject.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=L992GPQMS4 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_ENTITLEMENTS=BlueEquipProject/BlueEquipProject.entitlements \
            PROVISIONING_PROFILE_SPECIFIER="${MAIN_UUID}" \
            "PROVISIONING_PROFILE_SPECIFIER[BlueEquipProjectNotiServier]=${EXT_UUID}" \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            2>&1 | tee build/archive.log
          echo "=== Archive exit code: ${PIPESTATUS[0]} ==="
          echo "=== Error lines ==="
          grep -i "error:" build/archive.log | head -30
          exit ${PIPESTATUS[0]}

      - name: Export IPA
        script: |
          # source signing.env 读 MAIN_NAME / EXT_NAME（之前 Setup 脚本从 base64 解码后读出来的）
          source signing.env
          cat > build/export/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>L992GPQMS4</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.lockink.qingQuPro</key>
                  <string>${MAIN_NAME}</string>
                  <key>com.lockink.qingQuPro.BlueEquipProjectNotiServier</key>
                  <string>${EXT_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF
          echo "=== ExportOptions.plist ==="
          cat build/export/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/BlueEquipProject.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export/ExportOptions.plist

      - name: Cleanup keychain
        script: |
          security delete-keychain "$HOME/codemagic.keychain" 2>/dev/null || true
          rm -f /tmp/certificate.p12 /tmp/main.mobileprovision /tmp/ext.mobileprovision

    artifacts:
      - build/export/*.ipa
      - build/BlueEquipProject.xcarchive/dsyms/*.dSYM.zip

    publishing:
      email:
        recipients:
          - dzp998@163.com
        notify:
          success: true
          failure: true
