workflows:
  ios-workflow:
    name: BlueEquipProject Archive & Export
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        DEVELOPMENT_TEAM: L992GPQMS4
      groups:
        - signing
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    scripts:
      - name: Pod install
        script: |
          pod repo update
          pod install
          echo "=== Pod install done ==="

      - name: Patch QCloudSimplePing for Xcode 26
        script: |
          chmod -R u+w Pods/QCloudCore/
          PING_H="Pods/QCloudCore/QCloudCore/Classes/Base/QCLOUDRestNet/DNSCache/QCloudSimplePing.h"
          # 删除之前插入的 @import
          sed -i '' '/@import Darwin;/d' "$PING_H" 2>/dev/null || true
          # 删除之前插入的 #include
          sed -i '' '/#include <sys\/socket.h>/d' "$PING_H" 2>/dev/null || true
          sed -i '' '/#include <netinet\/in.h>/d' "$PING_H" 2>/dev/null || true
          sed -i '' '/#include <sys\/types.h>/d' "$PING_H" 2>/dev/null || true
          # 用 Python 替换：删除直接头文件导入，改为显式子模块导入
          python3 -c "
          f = '$PING_H'
          with open(f) as fh: c = fh.read()
          c = c.replace('#import <sys/_types/_sa_family_t.h>', '@import Darwin.POSIX.sys.types._sa_family_t;')
          with open(f, 'w') as fh: fh.write(c)
          "
          echo "=== Patched QCloudSimplePing.h ==="
          head -16 "$PING_H"
          echo "=== Verify ==="
          grep -n 'sa_family_t\|@import' "$PING_H"

      - name: Fix pbxproj signing
        script: |
          PBXPROJ="BlueEquipProject.xcodeproj/project.pbxproj"
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER\[sdk=iphoneos/d' "$PBXPROJ"
          echo "Removed SDK-specific SPECIFIER overrides"

      - name: Setup code signing
        script: |
          # 创建临时 keychain
          KEYCHAIN_PATH="$HOME/codemagic.keychain"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入证书
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k "$KEYCHAIN_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Certificate imported"

          # 安装 provisioning profiles
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_DIR/53f48a3c-823f-4e48-8911-ddb17f485846.mobileprovision"
          echo "$PROVISIONING_PROFILE_EXT_BASE64" | base64 --decode > "$PP_DIR/f46ef368-3b06-463b-8e9f-8d3acdfa3ace.mobileprovision"
          echo "Provisioning profiles installed"
          ls -la "$PP_DIR"

      - name: Archive
        script: |
          mkdir -p build
          # 清理 DerivedData 缓存
          rm -rf ~/Library/Developer/Xcode/DerivedData/BlueEquipProject-*
          set -o pipefail
          xcodebuild archive \
            -workspace BlueEquipProject.xcworkspace \
            -scheme BlueEquipProject \
            -configuration Release \
            -archivePath build/BlueEquipProject.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=L992GPQMS4 \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            2>&1 | tee build/archive.log
          echo "=== Archive exit code: ${PIPESTATUS[0]} ==="
          echo "=== Error lines ==="
          grep -i "error:" build/archive.log | head -20
          exit ${PIPESTATUS[0]}

      - name: Export IPA
        script: |
          mkdir -p build/export
          cat > build/export/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>L992GPQMS4</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.lockink.qingQuPro</key>
                  <string>lockink-appstore</string>
                  <key>com.lockink.qingQuPro.BlueEquipProjectNotiServier</key>
                  <string>BlueEquipProjectNotiServier</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/BlueEquipProject.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export/ExportOptions.plist

      - name: Cleanup keychain
        script: |
          security delete-keychain "$HOME/codemagic.keychain" 2>/dev/null || true
          rm -f /tmp/certificate.p12

    artifacts:
      - build/export/*.ipa
      - build/BlueEquipProject.xcarchive/dsyms/*.dSYM.zip

    publishing:
      email:
        recipients:
          - dzp998@163.com
        notify:
          success: true
          failure: true
