workflows:
  ios-workflow:
    name: BlueEquipProject Archive & Export
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        DEVELOPMENT_TEAM: L992GPQMS4
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    scripts:
      - name: Pod install
        script: |
          pod repo update
          pod install
          echo "=== Pod install done ==="

      - name: Patch QCloudCore for Xcode 26
        script: |
          find Pods/QCloudCore -name "*.m" -exec sed -i '' '1s/^/#import <CFNetwork\/CFHost.h>\n/' {} \; 2>/dev/null || true
          find Pods/QCloudCore -name "*.m" -exec sed -i '' '1s/^/#import <CoreServices\/AssertMacros.h>\n/' {} \; 2>/dev/null || true
          echo "Patched all QCloudCore .m files"

      - name: Fix pbxproj signing (remove SDK-specific SPECIFIER overrides)
        script: |
          PBXPROJ="BlueEquipProject.xcodeproj/project.pbxproj"
          # Remove SDK-specific PROVISIONING_PROFILE_SPECIFIER lines that override UUID-based lookup
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER\[sdk=iphoneos/d' "$PBXPROJ"
          echo "Removed SDK-specific PROVISIONING_PROFILE_SPECIFIER overrides"

      - name: Setup code signing
        script: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "=== Installed provisioning profiles ==="
          ls -la "$PP_DIR" 2>/dev/null || echo "Empty"

          # 查找已安装 profile 的实际 UUID 和 Bundle ID，更新 pbxproj
          PBXPROJ="BlueEquipProject.xcodeproj/project.pbxproj"
          MAIN_UUID=""
          EXT_UUID=""

          for f in "$PP_DIR"/*.mobileprovision; do
            [ -f "$f" ] || continue
            UUID=$(basename "$f" .mobileprovision)
            BUNDLE_ID=$(security cms -d -i "$f" 2>/dev/null | plutil -extract com.application-identifier raw -o - - 2>/dev/null | sed 's/.*\.//')
            echo "Profile: $UUID -> BundleID: $BUNDLE_ID"

            if [ "$BUNDLE_ID" = "com.lockink.qingQuPro" ]; then
              MAIN_UUID="$UUID"
            elif [ "$BUNDLE_ID" = "com.lockink.qingQuPro.BlueEquipProjectNotiServier" ]; then
              EXT_UUID="$UUID"
            fi
          done

          echo "Main App Profile UUID: $MAIN_UUID"
          echo "Extension Profile UUID: $EXT_UUID"

          # 更新 pbxproj 中的 PROVISIONING_PROFILE UUID
          if [ -n "$MAIN_UUID" ]; then
            sed -i '' "s/PROVISIONING_PROFILE = \"53f48a3c-823f-4e48-8911-ddb17f485846\"/PROVISIONING_PROFILE = \"$MAIN_UUID\"/g" "$PBXPROJ"
            echo "Updated pbxproj main app profile UUID"
          fi
          if [ -n "$EXT_UUID" ]; then
            sed -i '' "s/PROVISIONING_PROFILE = \"f46ef368-3b06-463b-8e9f-8d3acdfa3ace\"/PROVISIONING_PROFILE = \"$EXT_UUID\"/g" "$PBXPROJ"
            echo "Updated pbxproj extension profile UUID"
          fi

      - name: Archive
        script: |
          xcodebuild archive \
            -workspace BlueEquipProject.xcworkspace \
            -scheme BlueEquipProject \
            -configuration Release \
            -archivePath build/BlueEquipProject.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=L992GPQMS4 \
            CODE_SIGN_IDENTITY="iPhone Distribution"

      - name: Export IPA
        script: |
          mkdir -p build/export
          # 从 pbxproj 中读取更新后的 UUID
          MAIN_UUID=$(grep -m1 'PROVISIONING_PROFILE = ' BlueEquipProject.xcodeproj/project.pbxproj | head -1 | sed 's/.*= "//;s/".*//')
          EXT_UUID=$(grep 'PROVISIONING_PROFILE = ' BlueEquipProject.xcodeproj/project.pbxproj | tail -1 | sed 's/.*= "//;s/".*//')
          echo "Export UUIDs - Main: $MAIN_UUID, Ext: $EXT_UUID"

          cat > build/export/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>L992GPQMS4</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.lockink.qingQuPro</key>
                  <dict>
                      <key>signingStyle</key>
                      <string>manual</string>
                      <key>profileUUID</key>
                      <string>${MAIN_UUID}</string>
                  </dict>
                  <key>com.lockink.qingQuPro.BlueEquipProjectNotiServier</key>
                  <dict>
                      <key>signingStyle</key>
                      <string>manual</string>
                      <key>profileUUID</key>
                      <string>${EXT_UUID}</string>
                  </dict>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/BlueEquipProject.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export/ExportOptions.plist

    artifacts:
      - build/export/*.ipa
      - build/BlueEquipProject.xcarchive/dsyms/*.dSYM.zip

    publishing:
      email:
        recipients:
          - dzp998@163.com
        notify:
          success: true
          failure: true
