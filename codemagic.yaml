workflows:
  ios-workflow:
    name: BlueEquipProject Archive & Export
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        DEVELOPMENT_TEAM: L992GPQMS4
      groups:
        - signing
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    scripts:
      - name: Pod install
        script: |
          rm -rf Pods Podfile.lock
          pod repo update
          pod install
          echo "=== Pod install done ==="
          # 验证补丁
          grep "sys/socket.h" Pods/QCloudCore/QCloudCore/Classes/Base/QCLOUDRestNet/DNSCache/QCloudSimplePing.h || echo "⚠️ QCloudSimplePing.h not patched"
          grep "netinet/in.h" Pods/AFNetworking/AFNetworking/AFNetworkReachabilityManager.m || echo "⚠️ AFNetworking not patched"

      - name: Fix pbxproj signing
        script: |
          PBXPROJ="BlueEquipProject.xcodeproj/project.pbxproj"
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER\[sdk=iphoneos/d' "$PBXPROJ"
          echo "Removed SDK-specific SPECIFIER overrides"

      - name: Setup code signing
        script: |
          # Codemagic Settings 里上传的 profile / p12 会自动放到系统 keychain 和 Provisioning Profiles 目录
          # 这里只负责确保它们可被访问
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "=== 已安装的 provisioning profiles ==="
          ls -la "$PP_DIR" 2>/dev/null || echo "⚠️ $PP_DIR 不存在"
          echo ""
          echo "=== 当前钥匙串里的 Distribution identities ==="
          security find-identity -v -p codesigning 2>&1 | grep -i "distribution\|identity" | head -10

      - name: Archive
        script: |
          mkdir -p build
          # 清理 DerivedData 缓存
          rm -rf ~/Library/Developer/Xcode/DerivedData/BlueEquipProject-*
          set -o pipefail
          xcodebuild archive \
            -workspace BlueEquipProject.xcworkspace \
            -scheme BlueEquipProject \
            -configuration Release \
            -archivePath build/BlueEquipProject.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=L992GPQMS4 \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            2>&1 | tee build/archive.log
          echo "=== Archive exit code: ${PIPESTATUS[0]} ==="
          echo "=== Error lines ==="
          grep -i "error:" build/archive.log | head -20
          exit ${PIPESTATUS[0]}

      - name: Export IPA
        script: |
          mkdir -p build/export
          cat > build/export/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>L992GPQMS4</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.lockink.qingQuPro</key>
                  <string>lockink-appstore</string>
                  <key>com.lockink.qingQuPro.BlueEquipProjectNotiServier</key>
                  <string>com.lockink.qingQuPro.BlueEquipProjectNotiServier</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/BlueEquipProject.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export/ExportOptions.plist

      - name: Cleanup keychain
        script: |
          security delete-keychain "$HOME/codemagic.keychain" 2>/dev/null || true
          rm -f /tmp/certificate.p12

    artifacts:
      - build/export/*.ipa
      - build/BlueEquipProject.xcarchive/dsyms/*.dSYM.zip

    publishing:
      email:
        recipients:
          - dzp998@163.com
        notify:
          success: true
          failure: true
